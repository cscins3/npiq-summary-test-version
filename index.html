<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NPI-Q SUMMARY</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color-scheme: light; }
    * { box-sizing: border-box; }
    body { max-width: 1500px; margin: 0 auto; padding: 22px 18px 48px; color: #202b36; background: #fff; }
    h2 { text-align: center; margin: 8px 0 22px; font-size: clamp(24px, 3vw, 32px); }
    h3 { margin: 26px 0 12px; }
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid #cbd5e1; border-radius: 10px; }
    table { width: 100%; min-width: 1050px; border-collapse: collapse; table-layout: fixed; }
    col.item-col { width: 214px; }
    col.yes-col { width: 70px; }
    th, td { border: 1px solid #d9e0e8; padding: 0; text-align: center; }
    thead th { background: #edf2f7; padding: 14px 8px; font-size: 17px; line-height: 1.4; }
    thead small { font-size: 13px; font-weight: normal; }
    tbody tr:nth-child(even) { background: #f8fafc; }
    td.item-name { padding: 13px 10px; text-align: left; font-size: 16px; font-weight: 500; }
    .tap-target { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 58px; cursor: pointer; position: relative; }
    .tap-target:hover { background: #e6f1ff; }
    .tap-target:has(input:focus-visible) { outline: 3px solid #2b6cb0; outline-offset: -3px; }
    .tap-target:has(input:checked) { background: #dcecff; }
    .tap-target:has(input:disabled) { cursor: not-allowed; opacity: .42; }
    input[type="checkbox"], input[type="radio"] { width: 23px; height: 23px; margin: 0; accent-color: #2269b4; cursor: pointer; }
    input:disabled { cursor: not-allowed; }
    .choice-number { position: absolute; bottom: 3px; right: 7px; font-size: 11px; color: #6b7280; pointer-events: none; }
    .total-row th, .total-row td { background: #e6eef8; font-size: 21px; font-weight: 700; height: 58px; }
    .total-row th { font-size: 17px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
    button { min-height: 52px; padding: 12px 22px; border: 0; border-radius: 9px; color: #fff; background: #2364a5; font-size: 17px; font-weight: 600; cursor: pointer; }
    button:hover { filter: brightness(.93); }
    button:focus-visible { outline: 3px solid #ffb74d; outline-offset: 3px; }
    #copy-button { background: #24774c; }
    #reset-button { background: #6b7280; }
    #status { min-height: 22px; margin: 11px 0 0; font-size: 15px; color: #1e6743; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f8fafc; padding: 18px; border: 1px solid #cbd5e1; border-radius: 9px; text-align: left; font-size: 14px; line-height: 1.65; }
    @media(max-width:600px) { body { padding: 14px 10px 30px; } .actions button { flex: 1 1 145px; } h2 { margin-bottom: 15px; } }
  </style>
</head>
<body>
  <h2>NPI-Q SUMMARY</h2>
  <form id="npiq-form">
    <div class="table-scroll" role="region" aria-label="NPI-Q scoring table" tabindex="0">
      <table>
        <colgroup>
          <col class="item-col"><col class="yes-col"><col span="10">
        </colgroup>
        <thead>
          <tr>
            <th scope="col"> </th>
            <th scope="col">Yes</th>
            <th scope="colgroup" colspan="4">Severity<br><small>(0=None, 1=Mild, 2=Mod, 3=Severe)</small></th>
            <th scope="colgroup" colspan="6">Caregiver Distress<br><small>(0=Not at all → 5=Extremely)</small></th>
          </tr>
        </thead>
        <tbody id="item-rows"></tbody>
        <tfoot>
          <tr class="total-row">
            <th colspan="2" scope="row">TOTAL</th>
            <td colspan="4" id="severity-total">0</td>
            <td colspan="6" id="distress-total">0</td>
          </tr>
        </tfoot>
      </table>
    </div>
    <div class="actions">
      <button type="button" id="generate-button">Generate Summary</button>
      <button type="button" id="copy-button">Copy Report</button>
      <button type="button" id="reset-button">Reset</button>
    </div>
    <p id="status" aria-live="polite"></p>
  </form>
  <h3>Summary Output:</h3>
  <pre id="output" aria-live="polite"></pre>

  <script>
    'use strict';
    const items = [
      'Delusions', 'Hallucinations', 'Agitation/Aggression', 'Dysphoria/Depression', 'Anxiety',
      'Euphoria/Elation', 'Apathy/Indifference', 'Disinhibition', 'Irritability/Lability',
      'Aberrant Motor', 'Nighttime Behavior', 'Appetite/Eating'
    ];
    const rows = document.getElementById('item-rows');
    const status = document.getElementById('status');

    function choiceCell(kind, index, value) {
      const td = document.createElement('td');
      const label = document.createElement('label');
      label.className = 'tap-target';
      label.title = `${items[index]} — ${kind === 'severity' ? 'Severity' : 'Caregiver Distress'} ${value}`;
      const input = document.createElement('input');
      input.type = 'radio';
      input.className = kind;
      input.name = `${kind}_${index}`;
      input.value = String(value);
      input.disabled = true;
      input.setAttribute('aria-label', label.title);
      const hint = document.createElement('span');
      hint.className = 'choice-number';
      hint.textContent = String(value);
      hint.setAttribute('aria-hidden', 'true');
      label.append(input, hint);
      td.appendChild(label);
      return td;
    }

    items.forEach((item, i) => {
      const tr = document.createElement('tr');
      const nameCell = document.createElement('td');
      nameCell.className = 'item-name';
      nameCell.textContent = item;
      tr.appendChild(nameCell);
      const yesCell = document.createElement('td');
      const yesLabel = document.createElement('label');
      yesLabel.className = 'tap-target';
      yesLabel.title = `${item} — Yes`;
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'yes-check';
      checkbox.dataset.index = String(i);
      checkbox.setAttribute('aria-label', yesLabel.title);
      yesLabel.appendChild(checkbox);
      yesCell.appendChild(yesLabel);
      tr.appendChild(yesCell);
      for (let j = 0; j <= 3; j++) tr.appendChild(choiceCell('severity', i, j));
      for (let j = 0; j <= 5; j++) tr.appendChild(choiceCell('distress', i, j));
      rows.appendChild(tr);
    });

    function inputsFor(index, kind) {
      return document.querySelectorAll(`input[name="${kind}_${index}"]`);
    }

    function updateTotals() {
      const sum = kind => [...document.querySelectorAll(`input.${kind}:checked:not(:disabled)`)]
        .reduce((total, input) => total + Number(input.value), 0);
      document.getElementById('severity-total').textContent = sum('severity');
      document.getElementById('distress-total').textContent = sum('distress');
    }

    function createReport() {
      const severityTotal = [...document.querySelectorAll('input.severity:checked:not(:disabled)')]
        .reduce((sum, input) => sum + Number(input.value), 0);
      const distressTotal = [...document.querySelectorAll('input.distress:checked:not(:disabled)')]
        .reduce((sum, input) => sum + Number(input.value), 0);
      const detailLines = items.map((item, i) => {
        const sev = document.querySelector(`input[name="severity_${i}"]:checked:not(:disabled)`);
        const dis = document.querySelector(`input[name="distress_${i}"]:checked:not(:disabled)`);
        return `${item.padEnd(22)} | Severity: ${sev ? sev.value : '-'} | Distress: ${dis ? dis.value : '-'}`;
      }).join('\n');
      return `=== NPI-Q Summary ===\nSeverity Total: ${severityTotal}\nCaregiver Distress Total: ${distressTotal}\n\nDetails:\n` + detailLines;
    }

    function generateSummary() {
      updateTotals();
      const report = createReport();
      document.getElementById('output').textContent = report;
      status.textContent = '';
      return report;
    }

    rows.addEventListener('change', event => {
      const input = event.target;
      if (input.matches('.yes-check')) {
        const i = input.dataset.index;
        for (const kind of ['severity', 'distress']) {
          inputsFor(i, kind).forEach(radio => {
            if (!input.checked) radio.checked = false;
            radio.disabled = !input.checked;
          });
        }
      }
      updateTotals();
      // Prevent a stale report from showing after any selections change.
      document.getElementById('output').textContent = '';
      status.textContent = '';
    });

    async function copyReport() {
      // Generate afresh so the clipboard always matches current entries.
      const report = generateSummary();
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(report);
        } else {
          const helper = document.createElement('textarea');
          helper.value = report;
          helper.style.position = 'fixed';
          helper.style.left = '-9999px';
          document.body.appendChild(helper);
          helper.select();
          const succeeded = document.execCommand('copy');
          helper.remove();
          if (!succeeded) throw new Error('Copy command failed');
        }
        status.textContent = 'Report copied to clipboard.';
      } catch (error) {
        status.textContent = 'Unable to copy automatically. Please select and copy the Summary Output below.';
      }
    }

    function resetForm() {
      document.getElementById('npiq-form').reset();
      document.querySelectorAll('input.severity, input.distress').forEach(input => {
        input.checked = false;
        input.disabled = true;
      });
      document.getElementById('severity-total').textContent = '0';
      document.getElementById('distress-total').textContent = '0';
      document.getElementById('output').textContent = '';
      status.textContent = 'Form reset.';
    }

    document.getElementById('generate-button').addEventListener('click', generateSummary);
    document.getElementById('copy-button').addEventListener('click', copyReport);
    document.getElementById('reset-button').addEventListener('click', resetForm);
  </script>
</body>
</html>
